<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>What Would You Like To Eat? 💗</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap');

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #ffe8f0;
  font-family: 'Quicksand', sans-serif;
  color: #4b3040;
}

.card {
  width: 90%;
  max-width: 500px;
  text-align: center;
  padding: 30px 20px;
}

h1 {
  font-size: 32px;
  margin-bottom: 10px;
  color: #d94f83;
}

.subtitle {
  font-size: 18px;
  margin-bottom: 30px;
}

.food {
  display: block;
  width: 100%;
  margin: 15px 0;
  padding: 18px;
  border: none;
  border-radius: 20px;
  background: white;
  color: #d94f83;
  font-family: 'Quicksand', sans-serif;
  font-size: 20px;
  font-weight: 700;
  box-shadow: 0 8px 20px rgba(150, 80, 110, 0.15);
  cursor: pointer;
}

.food:active {
  transform: scale(0.96);
}

#message {
  margin-top: 25px;
  font-size: 19px;
  font-weight: 700;
  color: #d94f83;
}
</style>
</head>

<body>

<div class="card">

  <h1>What would you like to eat? 🍽️</h1>

  <div class="subtitle">
    Pick one 💗
  </div>

  <button class="food" onclick="chooseFood('Paneer Wrap 🌯')">
    🌯 Paneer Wrap
  </button>

  <button class="food" onclick="chooseFood('Bread Toast 🍞')">
    🍞 Bread Toast
  </button>

  <button class="food" onclick="chooseFood('Cheese Burger 🍔')">
    🍔 Cheese Burger
  </button>

  <div id="message"></div>

</div>

<script>
function chooseFood(food) {
  localStorage.setItem("selectedFood", food);
  window.location.href = "order.html";
}
</script>

</body>
    </html>
