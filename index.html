<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Breakfast 💗</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  background: #ffeaf0;
  font-family: "Baloo 2", cursive;
}

.card {
  width: 92%;
  max-width: 520px;
  text-align: center;
  position: relative;
}

.sparkle {
  position: fixed;
  font-size: 28px;
  animation: float 3s ease-in-out infinite;
}

.s1 { top: 12%; left: 10%; }
.s2 { top: 18%; right: 10%; animation-delay: .5s; }
.s3 { bottom: 15%; left: 12%; animation-delay: 1s; }
.s4 { bottom: 20%; right: 12%; animation-delay: 1.5s; }

@keyframes float {
  50% {
    transform: translateY(-12px) rotate(8deg);
  }
}

h1 {
  margin: 0 auto 35px;
  font-size: clamp(34px, 9vw, 52px);
  line-height: 1.05;
  font-weight: 800;
  color: #743d50;
  text-shadow: 3px 4px 0 white;
}

.pancake {
  font-size: 65px;
  display: block;
  margin: 10px 0 35px;
  animation: bounce 2s infinite;
}

@keyframes bounce {
  50% {
    transform: translateY(-8px);
  }
}

.playground {
  position: relative;
  width: 100%;
  height: 230px;
}

button {
  border: none;
  border-radius: 22px;
  padding: 17px 34px;
  font-family: "Baloo 2", cursive;
  font-size: 23px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 9px 0 rgba(180, 100, 130, .18),
              0 15px 25px rgba(100, 50, 70, .15);
  touch-action: manipulation;
}

#yes {
  position: absolute;
  left: 8%;
  top: 45%;
  background: #ff91ae;
  color: white;
}

#no {
  position: absolute;
  left: 60%;
  top: 45%;
  background: #bba7f5;
  color: white;
  transition: left .08s ease-out, top .08s ease-out;
}

#message {
  min-height: 35px;
  margin-top: 5px;
  color: #f05f85;
  font-size: 22px;
  font-weight: 700;
}

.heart {
  color: #ff6f96;
}
</style>
</head>

<body>

<div class="sparkle s1">✨</div>
<div class="sparkle s2">💗</div>
<div class="sparkle s3">⭐</div>
<div class="sparkle s4">💕</div>

<div class="card">

  <h1>
    Do you want your<br>
    breakfast?
  </h1>

  <div class="pancake">🥞</div>

  <div class="playground" id="playground">

    <button id="yes" onclick="goToDrinkPage()">
      YES 💗
    </button>

    <button id="no">
      NO 😭
    </button>

  </div>

  <div id="message"></div>

</div>

<script>
const noButton = document.getElementById("no");
const playground = document.getElementById("playground");
const message = document.getElementById("message");

function moveNo(event) {
  event.preventDefault();

  const maxX = playground.clientWidth - noButton.offsetWidth;
  const maxY = playground.clientHeight - noButton.offsetHeight;

  const x = Math.random() * maxX;
  const y = Math.random() * maxY;

  noButton.style.left = x + "px";
  noButton.style.top = y + "px";

  message.textContent = "Nope 😭 Try again!";
}

noButton.addEventListener("pointerdown", moveNo);

noButton.addEventListener("mouseenter", function() {
  if (window.innerWidth > 700) {
    moveNo();
  }
});

function goToDrinkPage() {
  window.location.href = "breakfast.html";
}
</script>

</body>
</html>
