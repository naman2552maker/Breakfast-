<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Choose Your Drink 💗</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap');

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #ffe8f0;
  font-family: 'Quicksand', sans-serif;
  color: #4b3040;
}

.card {
  width: 90%;
  max-width: 500px;
  text-align: center;
  padding: 30px 20px;
}

h1 {
  font-size: 34px;
  margin-bottom: 10px;
}

.subtitle {
  font-size: 18px;
  margin-bottom: 30px;
}

.drink {
  display: block;
  width: 100%;
  margin: 15px 0;
  padding: 18px;
  border: none;
  border-radius: 20px;
  background: white;
  color: #e76f9b;
  font-family: 'Quicksand', sans-serif;
  font-size: 20px;
  font-weight: 700;
  box-shadow: 0 8px 20px rgba(150, 80, 110, 0.15);
  cursor: pointer;
  transition: 0.2s;
}

.drink:active {
  transform: scale(0.96);
}

#message {
  margin-top: 25px;
  font-size: 20px;
  font-weight: 700;
  color: #e76f9b;
  min-height: 30px;
}
</style>
</head>

<h1>What drink do you want? 🥤</h1>

<div class="subtitle">
    Pick your favourite 💗
</div>

<button class="drink" onclick="window.location.href='food.html'">
    🍋 Lime Mojito
</button>

<button class="drink" onclick="window.location.href='food.html'">
    🍪 Oreo Shake
</button>

<button class="drink" onclick="window.location.href='food.html'">
    🍫 Hot Chocolate
</button>

<div id="message"></div>

<script>
function chooseDrink(drink) {
    window.location.href = "food.html";
}
}
</script>

</body>
</html>
