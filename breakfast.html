<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakfast 💗</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #ffe8ef;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: #4b3040;
}

.card {
  width: 92%;
  max-width: 500px;
  padding: 25px 15px;
}

h1 {
  font-size: 34px;
  line-height: 1.25;
  margin-bottom: 12px;
}

.subtitle {
  font-size: 20px;
  margin-bottom: 35px;
}

.playground {
  position: relative;
  width: 100%;
  height: 180px;
}

button {
  position: absolute;
  border: none;
  border-radius: 18px;
  padding: 15px 28px;
  font-size: 20px;
  font-weight: bold;
  box-shadow: 0 8px 20px rgba(0,0,0,0.12);
  cursor: pointer;
}

#yes {
  left: 18%;
  top: 55px;
  background: white;
  color: #d96b9b;
}

#no {
  left: 58%;
  top: 55px;
  background: white;
  color: #777;
  transition: all 0.2s ease;
}

#message {
  font-size: 19px;
  font-weight: bold;
  color: #d96b9b;
  min-height: 30px;
}
</style>
</head>

<body>

<div class="card">

  <h1>Do you want your breakfast? 🥞</h1>

  <div class="subtitle">
    Pick one 💗
  </div>

  <div class="playground" id="playground">

    <button id="yes">YES 💗</button>

    <button id="no">NO 😭</button>

  </div>

  <div id="message"></div>

</div>

<script>
const noButton = document.getElementById("no");
const yesButton = document.getElementById("yes");
const playground = document.getElementById("playground");
const message = document.getElementById("message");

noButton.addEventListener("click", function(event) {

  event.preventDefault();

  const maxX = playground.clientWidth - noButton.offsetWidth;
  const maxY = playground.clientHeight - noButton.offsetHeight;

  const x = Math.random() * maxX;
  const y = Math.random() * maxY;

  noButton.style.left = x + "px";
  noButton.style.top = y + "px";

  message.textContent = "Hehe 😭 NO nahi chalega!";
});

yesButton.addEventListener("click", function() {
  message.textContent = "Yayyy! Breakfast it is 🥞💗";
});
</script>

</body>
</html>
